{% set name = "igraph" %}
{% set version = "1.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/igraph/igraph/releases/download/{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: 969f2d7d22f67e788d8638c9a8c96615f50d7819c08978b3ef4a787bb6daa96c
  patches:
    - patches/0001_remove_safelocale.patch  # [osx]
    # clear the 'Libs.private' of generated igraph.pc file, in order to prevent pkg-config from attempting to link
    # against blas.lib and others in downstream packages (python-igraph).
    - patches/clear_pkgconfig_libs_private.patch  # [win]
    
build:
  number: 0
  run_exports:
    - {{ pin_subpackage("igraph", max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - python  # [win]
    - cmake
    - ninja
    - make  # [not win]
    - pkg-config  # [not win]
    - llvm-openmp  # [osx]
  host:
    - glpk 4.65
    - libxml2 {{ libxml2 }}
    - arpack 3.9.0  # [not win]
    - gmp 6.2.1  # [not win]
    - mpir 3.0.0  # [win]
    - openblas {{ openblas }}        # [blas_impl == "openblas"]
    - libopenblas {{ libopenblas }}  # [blas_impl == "openblas"]
    - libgomp                        # [blas_impl == "openblas" and linux]
    - vcomp14                        # [blas_impl == "openblas" and (win and x86_64)]
    - intel-openmp 2025.0.0          # [blas_impl == "mkl"]
    - mkl-devel 2025.0.0             # [blas_impl == "mkl"]
    - mkl 2025.0.0                   # [blas_impl == "mkl"]
  run:
    - {{ pin_compatible('intel-openmp') }}  # [blas_impl == "mkl"]
    - libopenblas  # [blas_impl == "openblas"]
    - libgomp      # [blas_impl == "openblas" and linux]

test:
  files:
    - igraph_test.c
  requires:
    - pkg-config  # [not win]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

about:
  home: https://igraph.org/c
  license: GPL-2.0-or-later
  license_family: GPL
  license_file:
    - COPYING
    - ACKNOWLEDGEMENTS.md
  summary: An open source and free collection of network analysis tool.
  description: |
    igraph is a collection of network analysis tools with the emphasis on efficiency,
    portabiliy and ease of use. igraph is open source and free. igraph can be
    programmed in R, Python and C/C++.
  doc_url: https://igraph.org/c/#docs
  dev_url: https://github.com/igraph/igraph

extra:
  recipe-maintainers:
    - sodre
    - vtraag
